workflows:
  ios-build:
    name: Build Camera Research IPA for qhun22
    instance_type: mac_mini_m1
    max_build_duration: 15
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: "CameraResearch.xcodeproj"
        XCODE_SCHEME: "CameraResearch"
        BUNDLE_ID: "com.qhun22.cameraresearch"
        APP_NAME: "CameraResearch"
      groups:
        - app_store_credentials
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.m2/repository
    scripts:
      - name: Select provisioning profiles
        script: |
          xcode-project use-profiles
      - name: Build and Archive
        script: |
          xcodebuild clean \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "build/$APP_NAME.xcarchive" \
            -allowProvisioningUpdates \
            archive
      - name: Export IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath "build/$APP_NAME.xcarchive" \
            -exportPath build \
            -exportOptionsPlist ExportOptions.plist
          cp "build/$APP_NAME.ipa" "build/$APP_NAME.tipa"
    artifacts:
      - build/CameraResearch.ipa
      - build/CameraResearch.tipa
      - build/CameraResearch.xcarchive
