workflows:
  ios-build:
    name: Build Camera Research IPA for qhun22
    instance_type: mac_mini_m1
    max_build_duration: 15
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: "CameraResearch.xcodeproj"
        XCODE_SCHEME: "CameraResearch"
        BUNDLE_ID: "com.qhun22.cameraresearch"
        APP_NAME: "CameraResearch"
        APPLE_DEVELOPER_TEAM: ""
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.m2/repository
    scripts:
      - name: Build and Archive
        script: |
          xcodebuild clean \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "build/$APP_NAME.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPER_TEAM" \
            CODE_SIGN_STYLE="Automatic" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive
      - name: Export IPA
        script: |
          APP_PATH="build/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app"
          test -d "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry "$APP_NAME.ipa" Payload)
          rm -rf build/Payload
          cp "build/$APP_NAME.ipa" "build/$APP_NAME.tipa"
    artifacts:
      - build/CameraResearch.ipa
      - build/CameraResearch.tipa
      - build/CameraResearch.xcarchive
