workflows:
  ios-build:
    name: Build Camera Research IPA (Unsigned)
    instance_type: mac_mini_m1
    max_build_duration: 15
    environment:
      xcode: latest
    scripts:
      - name: Build Unsigned IPA
        script: |
          set -euxo pipefail

          echo "Building unsigned IPA for TrollStore"
          rm -rf build Payload CameraResearch.ipa CameraResearch.tipa

          xcodebuild \
            -project CameraResearch.xcodeproj \
            -scheme CameraResearch \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build

          APP_PATH="build/Build/Products/Release-iphoneos/CameraResearch.app"
          test -d "$APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/CameraResearch.app

          # IPA and TIPA are the same unsigned ZIP with different extensions.
          ditto -c -k --sequesterRsrc --keepParent Payload CameraResearch.ipa
          cp CameraResearch.ipa CameraResearch.tipa

          unzip -l CameraResearch.ipa
    artifacts:
      - CameraResearch.ipa
      - CameraResearch.tipa
