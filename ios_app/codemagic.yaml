workflows:
  ios-build:
    name: Build Camera Research IPA
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.yourcompany.cameraresearch
      groups:
        - app_store_credentials
    scripts:
      - name: Select provisioning profiles
        script: |
          xcode-project use-profiles
      - name: Build and archive
        script: |
          cd ios_app/CameraResearch
          xcodebuild \
            -project CameraResearch.xcodeproj \
            -scheme CameraResearch \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/CameraResearch.xcarchive" \
            archive
      - name: Export IPA
        script: |
          cd ios_app/CameraResearch
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/CameraResearch.xcarchive" \
            -exportPath "$CM_BUILD_DIR/export" \
            -exportOptionsPlist ExportOptions.plist
          mkdir -p "$CM_BUILD_DIR/artifacts"
          cp "$CM_BUILD_DIR/export/CameraResearch.ipa" "$CM_BUILD_DIR/artifacts/CameraResearch.ipa"
          cp "$CM_BUILD_DIR/export/CameraResearch.ipa" "$CM_BUILD_DIR/artifacts/CameraResearch.tipa"
    artifacts:
      - $CM_BUILD_DIR/artifacts/CameraResearch.ipa
      - $CM_BUILD_DIR/artifacts/CameraResearch.tipa
