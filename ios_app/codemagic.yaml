workflows:
  ios-build:
    name: Build Camera Research IPA (Unsigned)
    instance_type: mac_mini_m1
    max_build_duration: 15
    environment:
      xcode: latest
    scripts:
      - name: Build Unsigned IPA
        script: |
          echo "🔨 Building unsigned IPA for TrollStore..."

          # Clean
          xcodebuild clean \
            -project CameraResearch.xcodeproj \
            -scheme CameraResearch || true

          # Build - KHÔNG KÝ
          xcodebuild \
            -project CameraResearch.xcodeproj \
            -scheme CameraResearch \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER=""

          # Tạo Payload
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/CameraResearch.app Payload/

          # Tạo IPA
          zip -r CameraResearch.ipa Payload

          # Tạo TIPA (đổi tên)
          cp CameraResearch.ipa CameraResearch.tipa

          echo "✅ Build thành công!"
          ls -la
    artifacts:
      - CameraResearch.ipa
      - CameraResearch.tipa
