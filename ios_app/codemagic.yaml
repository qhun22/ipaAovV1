workflows:
  ios-build:
    name: Build Camera Research IPA
    instance_type: mac_mini_m1
    max_build_duration: 15
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: "CameraResearch.xcodeproj"
        XCODE_SCHEME: "CameraResearch"
        BUNDLE_ID: "com.qhun22.cameraresearch"
        APP_NAME: "CameraResearch"
        APPLE_DEVELOPER_TEAM: "DUMMYTEAM" # ✅ KHÔNG ĐỂ TRỐNG
    scripts:
      - name: Build and Archive
        script: |
          echo "🔨 Building Camera Research..."

          # Clean build
          xcodebuild clean -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" || true

          # Archive
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "build/$APP_NAME.xcarchive" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPER_TEAM" \
            CODE_SIGN_STYLE="Automatic" \
            CODE_SIGN_IDENTITY="iPhone Developer" \
            PROVISIONING_PROFILE_SPECIFIER=""

          # Export IPA
          xcodebuild -exportArchive \
            -archivePath "build/$APP_NAME.xcarchive" \
            -exportPath "build" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPER_TEAM" \
            CODE_SIGN_STYLE="Automatic"

          # Kiểm tra file
          if [ -f "build/$APP_NAME.ipa" ]; then
            echo "✅ IPA created successfully!"
            cp "build/$APP_NAME.ipa" "build/$APP_NAME.tipa"
            echo "✅ TIPA created successfully!"
            ls -la build/
          else
            echo "❌ IPA not found!"
            exit 1
          fi
    artifacts:
      - build/*.ipa
      - build/*.tipa
